<line x1="250" y1="495" x2="250" y2="400" stroke="#2467a1" stroke-width="3"/>
<polygon points="250,400 256.2325320018546,411.4085733045749 243.76746799814535,411.4085733045748" fill="#2467a1"/>
<text x="60" y="759.93" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52657a">Cross-cutting responsibilities: identity, context, policy, cost, and observability.</text>
<text x="60" y="795.11" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52657a">Activities can overlap. Observation alone does not authorize remediation.</text></svg>