<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img"><title>Carry evidence through the lifecycle</title><desc>Each transition should expose the artifact and the decision it supports.. Proposed lifecycle. Sources: NIST SSDF v1.1 (2022); Gu et al. (2025); Google SRE (2018).</desc><rect width="1400" height="820" fill="#f7f9fc"/>
<text x="60" y="72.75999999999999" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172b46">Carry evidence through the lifecycle</text>
<text x="60" y="114.11" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52657a">Each transition should expose the artifact and the decision it supports.</text>
<rect x="60" y="225" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="80" y="264.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Intent</text>
<text x="80" y="301.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Desired outcome</text>
<text x="80" y="328.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Constraints and owner</text>
<rect x="510" y="225" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="530" y="264.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Specification</text>
<text x="530" y="301.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Behavior and invariants</text>
<text x="530" y="328.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Acceptance criteria</text>
<rect x="960" y="225" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="980" y="264.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Execution</text>
<text x="980" y="301.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Candidate revision</text>
<text x="980" y="328.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Execution record</text>
<rect x="960" y="505" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="980" y="544.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Verification / delivery</text>
<text x="980" y="581.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Scoped evidence</text>
<text x="980" y="608.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Authorized exposure</text>
<rect x="510" y="505" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="530" y="544.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Operation</text>
<text x="530" y="581.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Reliability signals</text>
<text x="530" y="608.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">User outcomes</text>
<rect x="60" y="505" width="380" height="165" rx="12" fill="#ffffff" stroke="#cdd8e5" stroke-width="2"/>
<text x="80" y="544.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2467a1">Feedback</text>
<text x="80" y="581.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Investigation</text>
<text x="80" y="608.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b46">Next proposed correction</text>
