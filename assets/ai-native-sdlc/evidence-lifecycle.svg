<polygon points="1150,495 1143.7674679981453,483.5914266954252 1156.2325320018547,483.5914266954251" fill="#2467a1"/>
<line x1="950" y1="590" x2="900" y2="590" stroke="#2467a1" stroke-width="3"/>
