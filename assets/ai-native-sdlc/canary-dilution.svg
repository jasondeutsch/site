<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img"><title>Aggregate monitoring can hide a bad canary</title><desc>Worked example: 5% canary traffic, 20% canary errors; assume 0% control errors.. Illustrative arithmetic — not observed study data. Source: Google SRE, Canarying Releases (2018), monitoring-data example.</desc><rect width="1400" height="820" fill="#f7f9fc"/>
<text x="60" y="72.75999999999999" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172b46">Aggregate monitoring can hide a bad canary</text>
<text x="60" y="114.11" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#52657a">Worked example: 5% canary traffic, 20% canary errors; assume 0% control errors.</text>
<line x1="430" y1="235" x2="430" y2="630" stroke="#cdd8e5" stroke-width="2"/>
<text x="420" y="668.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52657a">0%</text>
<line x1="610" y1="235" x2="610" y2="630" stroke="#cdd8e5" stroke-width="2"/>
<text x="600" y="668.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52657a">5%</text>
<line x1="790" y1="235" x2="790" y2="630" stroke="#cdd8e5" stroke-width="2"/>
<text x="780" y="668.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52657a">10%</text>
<line x1="970" y1="235" x2="970" y2="630" stroke="#cdd8e5" stroke-width="2"/>
<text x="960" y="668.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52657a">15%</text>
<line x1="1150" y1="235" x2="1150" y2="630" stroke="#cdd8e5" stroke-width="2"/>
<text x="1140" y="668.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52657a">20%</text>
<text x="60" y="309.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b46">Control population</text>
<line x1="430" y1="270" x2="430" y2="335" stroke="#16786c" stroke-width="4"/>
<text x="448" y="311.66" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#16786c">0%</text>
<text x="60" y="429.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b46">Canary population</text>
<rect x="430" y="390" width="720" height="65" rx="12" fill="#ad5032" stroke="#ad5032" stroke-width="2"/>
<text x="1168" y="431.66" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ad5032">20%</text>
<text x="60" y="549.84" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b46">Whole-service aggregate</text>
<rect x="430" y="510" width="36" height="65" rx="12" fill="#2467a1" stroke="#2467a1" stroke-width="2"/>
<text x="484" y="551.66" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2467a1">1%</text>
<text x="60" y="742.57" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b46">Aggregate error rate = (0.05 × 20%) + (0.95 × 0%) = 1%</text>
<text x="60" y="788.02" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#52657a">Compare canary and control separately; a service-wide metric can dilute the signal.</text></svg>