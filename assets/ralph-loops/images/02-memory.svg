<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
<title id="title">What survives a fresh context</title><desc id="desc">Conversation reset removes transient history; it does not undo work.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a7b8ce"/></marker></defs>
<rect width="1200" height="575" rx="18" fill="#101827"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="55" fill="#e8eef8" font-size="29" font-weight="700">What survives a fresh context</text><text x="44" y="88" fill="#a7b8ce" font-size="17">Conversation reset removes transient history; it does not undo work.</text><rect x="45" y="140" width="340" height="165" rx="12" fill="#19263a" stroke="#86b5ff" stroke-width="2"/><text x="63" y="172" fill="#86b5ff" font-size="21" font-weight="700">Iteration n</text><text x="63" y="204" fill="#e8eef8" font-size="17">Prompt + selected evidence</text><text x="63" y="229" fill="#e8eef8" font-size="17">Investigation and tool calls</text><text x="63" y="254" fill="#e8eef8" font-size="17">Working hypotheses</text><rect x="430" y="140" width="340" height="165" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="448" y="172" fill="#55dbc1" font-size="21" font-weight="700">Repository / state</text><text x="448" y="204" fill="#e8eef8" font-size="17">Code and specifications</text><text x="448" y="229" fill="#e8eef8" font-size="17">Acceptance failures and logs</text><text x="448" y="254" fill="#e8eef8" font-size="17">Task and attempt records</text><rect x="815" y="140" width="340" height="165" rx="12" fill="#19263a" stroke="#86b5ff" stroke-width="2"/><text x="833" y="172" fill="#86b5ff" font-size="21" font-weight="700">Iteration n + 1</text><text x="833" y="204" fill="#e8eef8" font-size="17">New conversation</text><text x="833" y="229" fill="#e8eef8" font-size="17">Read current artifacts</text><text x="833" y="254" fill="#e8eef8" font-size="17">Reconstruct next action</text><path d="M385 225 H430" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M770 225 H815" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="45" y="385" width="1110" height="125" rx="12" fill="#19263a" stroke="#ffbd7a" stroke-width="2"/><text x="63" y="417" fill="#ffbd7a" font-size="21" font-weight="700">Carry forward evidence, not the entire transcript</text><text x="63" y="449" fill="#e8eef8" font-size="17">Retain: exact failing assertion, relevant paths, decisions and constraints.</text><text x="63" y="474" fill="#e8eef8" font-size="17">Discard from active input: repeated logs, abandoned speculation, unrelated tool output.</text></g></svg>