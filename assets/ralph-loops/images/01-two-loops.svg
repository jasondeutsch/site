<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Two loops, two different lifetimes</title><desc id="desc">The outer controller resets the conversation. The repository and evidence survive.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a7b8ce"/></marker></defs>
<rect width="1200" height="600" rx="18" fill="#101827"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="55" fill="#e8eef8" font-size="29" font-weight="700">Two loops, two different lifetimes</text><text x="44" y="88" fill="#a7b8ce" font-size="17">The outer controller resets the conversation. The repository and evidence survive.</text><rect x="45" y="135" width="290" height="150" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="63" y="167" fill="#55dbc1" font-size="21" font-weight="700">Outer controller</text><text x="63" y="199" fill="#e8eef8" font-size="17">Select one task</text><text x="63" y="224" fill="#e8eef8" font-size="17">Set budgets and assemble input</text><text x="63" y="249" fill="#e8eef8" font-size="17">Start a fresh agent session</text><rect x="415" y="135" width="355" height="150" rx="12" fill="#19263a" stroke="#86b5ff" stroke-width="2"/><text x="433" y="167" fill="#86b5ff" font-size="21" font-weight="700">Inner agent loop</text><text x="433" y="199" fill="#e8eef8" font-size="17">Model → tools → observations</text><text x="433" y="224" fill="#e8eef8" font-size="17">Repeat within this conversation</text><text x="433" y="249" fill="#e8eef8" font-size="17">Return when this attempt ends</text><rect x="850" y="135" width="300" height="150" rx="12" fill="#19263a" stroke="#ffbd7a" stroke-width="2"/><text x="868" y="167" fill="#ffbd7a" font-size="21" font-weight="700">Independent verifier</text><text x="868" y="199" fill="#e8eef8" font-size="17">Run required acceptance checks</text><text x="868" y="224" fill="#e8eef8" font-size="17">Bind results to artifact identity</text><text x="868" y="249" fill="#e8eef8" font-size="17">Accept, retry, or stop</text><path d="M335 210 H415" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M770 210 H850" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="330" y="390" width="540" height="135" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="348" y="422" fill="#55dbc1" font-size="21" font-weight="700">Durable state</text><text x="348" y="454" fill="#e8eef8" font-size="17">Source, specifications, task plan, failure evidence</text><text x="348" y="479" fill="#e8eef8" font-size="17">Reconstructed into the next conversation</text><path d="M1000 285 V345 H190 V285" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M590 285 V390" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="330" y="560" fill="#a7b8ce" font-size="17">Continue only while work and budget remain</text></g></svg>