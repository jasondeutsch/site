<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Prompts describe policy; isolation enforces it</title><desc id="desc">The included example separates responsibilities. Production isolation needs an execution boundary.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a7b8ce"/></marker></defs>
<rect width="1200" height="610" rx="18" fill="#101827"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="55" fill="#e8eef8" font-size="29" font-weight="700">Prompts describe policy; isolation enforces it</text><text x="44" y="88" fill="#a7b8ce" font-size="17">The included example separates responsibilities. Production isolation needs an execution boundary.</text><rect x="45" y="145" width="475" height="180" rx="12" fill="#19263a" stroke="#86b5ff" stroke-width="2"/><text x="63" y="177" fill="#86b5ff" font-size="21" font-weight="700">Agent execution environment</text><text x="63" y="209" fill="#e8eef8" font-size="17">Writable: candidate source and local tests</text><text x="63" y="234" fill="#e8eef8" font-size="17">Readable: selected requirements and feedback</text><text x="63" y="259" fill="#e8eef8" font-size="17">No deployment credentials or host access</text><rect x="680" y="145" width="475" height="180" rx="12" fill="#19263a" stroke="#ffbd7a" stroke-width="2"/><text x="698" y="177" fill="#ffbd7a" font-size="21" font-weight="700">Controller / verifier environment</text><text x="698" y="209" fill="#e8eef8" font-size="17">Owns: checks, budgets, task definitions</text><text x="698" y="234" fill="#e8eef8" font-size="17">Reads: candidate snapshot and tool outcomes</text><text x="698" y="259" fill="#e8eef8" font-size="17">Records: evidence for that snapshot</text><path d="M520 210 H680" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M680 275 H520" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="548" y="195" fill="#a7b8ce" font-size="15">snapshot</text><text x="548" y="305" fill="#a7b8ce" font-size="15">feedback</text><rect x="180" y="420" width="840" height="125" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="198" y="452" fill="#55dbc1" font-size="21" font-weight="700">Review / integration boundary</text><text x="198" y="484" fill="#e8eef8" font-size="17">Passing an implementation loop produces a reviewable candidate.</text><text x="198" y="509" fill="#e8eef8" font-size="17">Merging or deploying uses separate credentials and release rules.</text></g></svg>