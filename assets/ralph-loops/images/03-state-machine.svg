<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">The controller owns the exit decision</title><desc id="desc">An assistant report is a proposal. Passing required checks is acceptance evidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a7b8ce"/></marker></defs>
<rect width="1200" height="650" rx="18" fill="#101827"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="55" fill="#e8eef8" font-size="29" font-weight="700">The controller owns the exit decision</text><text x="44" y="88" fill="#a7b8ce" font-size="17">An assistant report is a proposal. Passing required checks is acceptance evidence.</text><rect x="45" y="150" width="290" height="140" rx="12" fill="#19263a" stroke="#ffbd7a" stroke-width="2"/><text x="63" y="182" fill="#ffbd7a" font-size="21" font-weight="700">Verify current files</text><text x="63" y="214" fill="#e8eef8" font-size="17">First failing task selected</text><text x="63" y="239" fill="#e8eef8" font-size="17">All pass → complete</text><rect x="450" y="150" width="290" height="140" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="468" y="182" fill="#55dbc1" font-size="21" font-weight="700">Check admission</text><text x="468" y="214" fill="#e8eef8" font-size="17">Attempts and time remain?</text><text x="468" y="239" fill="#e8eef8" font-size="17">Writer lock held?</text><rect x="855" y="150" width="290" height="140" rx="12" fill="#19263a" stroke="#86b5ff" stroke-width="2"/><text x="873" y="182" fill="#86b5ff" font-size="21" font-weight="700">Run fresh attempt</text><text x="873" y="214" fill="#e8eef8" font-size="17">One task; bounded runtime</text><text x="873" y="239" fill="#e8eef8" font-size="17">Save logs and revalidate</text><path d="M335 220 H450" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M740 220 H855" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1000 150 V120 H190 V150" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="450" y="115" fill="#a7b8ce" font-size="14">Attempt returns successfully → reverify</text><rect x="45" y="440" width="290" height="125" rx="12" fill="#19263a" stroke="#55dbc1" stroke-width="2"/><text x="63" y="472" fill="#55dbc1" font-size="21" font-weight="700">Complete</text><text x="63" y="504" fill="#e8eef8" font-size="17">Record content fingerprint</text><text x="63" y="529" fill="#e8eef8" font-size="17">Reverify after a restart</text><rect x="450" y="440" width="290" height="125" rx="12" fill="#19263a" stroke="#ffbd7a" stroke-width="2"/><text x="468" y="472" fill="#ffbd7a" font-size="21" font-weight="700">Stop for inspection</text><text x="468" y="504" fill="#e8eef8" font-size="17">Budget / no progress / error</text><text x="468" y="529" fill="#e8eef8" font-size="17">Keep artifacts and evidence</text><path d="M190 290 V440" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M595 290 V440" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1000 290 V390 H790 V505 H740" fill="none" stroke="#a7b8ce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="385" fill="#a7b8ce" font-size="15">All pass</text><text x="610" y="385" fill="#a7b8ce" font-size="15">No budget</text><text x="875" y="380" fill="#a7b8ce" font-size="15">Error / timeout</text></g></svg>